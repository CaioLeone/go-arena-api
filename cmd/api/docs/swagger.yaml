definitions:
  dto.AddExperienceRequest:
    properties:
      experience:
        minimum: 1
        type: integer
    required:
    - experience
    type: object
  dto.BattleCreateRequest:
    properties:
      attacker_character_id:
        type: string
      defender_character_id:
        type: string
    required:
    - attacker_character_id
    - defender_character_id
    type: object
  dto.CharacterCreateRequest:
    properties:
      class:
        enum:
        - Barbaro
        - Mago
        - Arqueiro
        - Assassino
        type: string
      name:
        maxLength: 25
        minLength: 1
        type: string
    required:
    - class
    - name
    type: object
  dto.CharacterUpdateRequest:
    properties:
      name:
        maxLength: 25
        minLength: 1
        type: string
    required:
    - name
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.SpendAttributePointsRequest:
    properties:
      attack:
        maximum: 100
        minimum: 0
        type: integer
      critical_chance:
        maximum: 100
        minimum: 0
        type: integer
      defense:
        maximum: 100
        minimum: 0
        type: integer
      hp:
        maximum: 100
        minimum: 0
        type: integer
    type: object
  dto.UserCreateRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  dto.UserLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
info:
  contact: {}
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentica um usuário.
      parameters:
      - description: Credenciais
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UserLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Gera um novo Access Token usando Refresh Token.
      parameters:
      - description: Refresh Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Renovar Access Token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Cria um novo usuário e retorna os tokens JWT.
      parameters:
      - description: Dados do usuário
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UserCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Registrar usuário
      tags:
      - Auth
  /battles:
    post:
      consumes:
      - application/json
      description: Inicia uma batalha entre dois personagens e salva o resultado.
      parameters:
      - description: Dados da batalha
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.BattleCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Iniciar batalha
      tags:
      - Battles
  /battles/history:
    get:
      description: Retorna o histórico de batalhas do usuário autenticado.
      parameters:
      - default: 10
        description: Quantidade de registros
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset da paginação
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Histórico de batalhas
      tags:
      - Battles
  /characters:
    get:
      description: Retorna todos os personagens do usuário autenticado.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Listar personagens
      tags:
      - Characters
    post:
      consumes:
      - application/json
      description: Cria um novo personagem para o usuário autenticado.
      parameters:
      - description: Dados do personagem
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CharacterCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Criar personagem
      tags:
      - Characters
  /characters/{id}:
    delete:
      description: Remove um personagem do usuário autenticado.
      parameters:
      - description: ID do personagem
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Deletar personagem
      tags:
      - Characters
    get:
      description: Retorna um personagem específico do usuário autenticado.
      parameters:
      - description: ID do personagem
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Buscar personagem
      tags:
      - Characters
    put:
      consumes:
      - application/json
      description: Atualiza os dados de um personagem.
      parameters:
      - description: ID do personagem
        in: path
        name: id
        required: true
        type: string
      - description: Novos dados do personagem
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CharacterUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Atualizar personagem
      tags:
      - Characters
  /characters/{id}/attributes:
    post:
      consumes:
      - application/json
      description: Gasta pontos de atributo obtidos ao subir de nível.
      parameters:
      - description: ID do personagem
        in: path
        name: id
        required: true
        type: string
      - description: Distribuição dos pontos
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SpendAttributePointsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Distribuir pontos de atributo
      tags:
      - Characters
  /characters/{id}/experience:
    post:
      consumes:
      - application/json
      description: Adiciona experiência ao personagem e realiza level up automaticamente.
      parameters:
      - description: ID do personagem
        in: path
        name: id
        required: true
        type: string
      - description: Experiência
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AddExperienceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Adicionar experiência
      tags:
      - Characters
  /ranking:
    get:
      description: Retorna o ranking de todos os personagens pertencentes ao usuário
        autenticado.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Ranking do usuário
      tags:
      - Ranking
  /ranking/top:
    get:
      description: Retorna os jogadores com maior pontuação no leaderboard.
      parameters:
      - default: 10
        description: Quantidade de jogadores (máximo 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Top Ranking
      tags:
      - Ranking
swagger: "2.0"
